# ============================================================================
# docker-compose.test.yml — Postgres DESCARTÁVEL para os testes de banco.
#
#   make test-db-up      sobe
#   make test-all        sobe, roda tudo, derruba (mesmo se falhar)
#   make test-db-down    derruba e apaga
#
# NUNCA É PRODUÇÃO, e há três travas para isso:
#   • porta 5433 (produção é 5432) e presa em 127.0.0.1 — não escuta na rede local;
#   • os dados vivem em tmpfs (memória): o container morre, tudo some, nada persiste;
#   • senha fixa e boba, que só vale aqui dentro.
# O alvo `make migrate` recusa DSN que não seja 127.0.0.1/localhost, então nem por
# engano uma migração de teste alcança a VPS.
#
# Major 16 = a mesma dos itests já existentes no repo. A versão de produção não é
# declarada em lugar nenhum deste repositório (o Postgres é externo, administrado
# fora daqui); se um dia divergir, mude aqui e diga por quê no DECISIONS.md.
# ============================================================================
# PROJETO PRÓPRIO, E ISTO NÃO É DETALHE: sem `name`, o Docker deriva o nome do projeto
# da PASTA — e na VPS este arquivo e o docker-compose.lead-manager.yml moram na mesma.
# Os dois cairiam no projeto "adr-lead-manager", e aí um `down` daqui enxergaria o
# container de PRODUÇÃO como órfão do projeto. Com nome próprio, o mundo deste arquivo
# começa e termina nele.
name: adr-lm-teste

services:
  pg-teste:
    image: postgres:16-alpine
    container_name: adr-lm-pg-teste
    environment:
      POSTGRES_PASSWORD: itest
      POSTGRES_DB: postgres
      # initdb mais rápido: é banco descartável, durabilidade não importa aqui.
      POSTGRES_INITDB_ARGS: "--nosync"
    ports:
      # 127.0.0.1 de propósito: não escuta na rede. Rodando na VPS, ninguém de fora alcança.
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    # Limites que o anexo de riscos do ADR-051 (X10) pede: quando este container sobe na
    # VPS, ele divide CPU e disco com produção. Sem teto, uma suíte pesada degrada o
    # atendimento real — o teste não pode custar caro para quem está sendo atendido.
    cpus: 1.0
    mem_limit: 1g
    # fsync off: acelera a suíte. NUNCA copie isto para produção.
    command: >-
      postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 40
      start_period: 3s
